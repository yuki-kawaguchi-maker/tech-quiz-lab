<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Quiz Lab</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --color-correct: #2e7d32;
    --color-wrong: #c62828;
    --color-active: #1565c0;
    --color-muted: #757575;
    --color-accent: #fbc02d;
    --color-text: #1a1a1a;
    --color-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    max-width: 100vw;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 16px 40px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 8px 0 16px;
  }
  h2 {
    font-size: 1.05rem;
    margin: 0 0 10px;
  }
  section {
    margin-bottom: 20px;
  }
  fieldset {
    border: 1px solid rgba(117, 117, 117, 0.4);
    border-radius: 8px;
    margin: 0 0 16px;
    padding: 10px 12px;
  }
  legend {
    font-weight: bold;
    padding: 0 4px;
  }
  label {
    display: block;
    padding: 4px 0;
  }
  label input {
    margin-right: 8px;
  }
  select {
    font-size: 1rem;
    padding: 6px;
    width: 100%;
  }
  button {
    font-size: 1rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(117, 117, 117, 0.4);
    background: var(--color-bg);
    color: var(--color-text);
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  button.primary {
    background: var(--color-active);
    border-color: var(--color-active);
    color: #fff;
    font-weight: bold;
  }
  button.secondary-muted {
    color: var(--color-muted);
    border-color: rgba(117, 117, 117, 0.4);
  }
  button.back-btn {
    margin-top: 24px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #stats-box {
    border: 1px solid rgba(117, 117, 117, 0.4);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  #stats-box p {
    margin: 4px 0;
  }
  #stats-by-category {
    margin: 6px 0 0;
    padding-left: 18px;
  }
  #stats-by-category li {
    margin: 2px 0;
  }
  .quiz-meta {
    color: var(--color-muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 1.05rem;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .choice-btn {
    text-align: left;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    white-space: normal;
  }
  .choice-btn .choice-label {
    flex: 0 0 auto;
    font-weight: bold;
    color: var(--color-active);
  }
  .choice-btn:hover {
    border-color: var(--color-active);
  }
  .result-banner {
    font-weight: bold;
    font-size: 1.1rem;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    color: #fff;
  }
  .result-banner.correct { background: var(--color-correct); }
  .result-banner.wrong { background: var(--color-wrong); }
  .key-concept-box {
    background: rgba(251, 192, 45, 0.25);
    border: 1px solid var(--color-accent);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-weight: bold;
  }
  .diagram-box {
    margin-bottom: 16px;
  }
  .diagram-box svg {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .explanation-box {
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .choices-review {
    margin-bottom: 16px;
  }
  .choice-review-item {
    border: 1px solid rgba(117, 117, 117, 0.4);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .choice-review-item.is-correct-answer {
    border-color: var(--color-correct);
    background: rgba(46, 125, 50, 0.08);
  }
  .choice-review-item.is-user-wrong-pick {
    border-color: var(--color-wrong);
    background: rgba(198, 40, 40, 0.08);
  }
  .choice-review-item .choice-review-text {
    font-weight: bold;
  }
  .choice-review-item .choice-review-why {
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .practice-note-box {
    border-left: 3px solid var(--color-muted);
    padding-left: 10px;
    color: var(--color-muted);
    margin-bottom: 16px;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .save-warning {
    color: var(--color-wrong);
    font-size: 0.85rem;
    margin: 4px 0;
  }
  #daily-loop-box {
    border: 1px solid rgba(21, 101, 192, 0.4);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  #daily-start-btn {
    font-size: 1.1rem;
    padding: 14px;
  }
  #welcome-back-message {
    color: var(--color-active);
    font-weight: bold;
    margin: 8px 0 0;
  }
  .gauge-track {
    background: rgba(117, 117, 117, 0.2);
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
    margin-top: 4px;
  }
  .gauge-fill {
    background: var(--color-active);
    height: 100%;
  }
  #gauge-text, #streak-text {
    margin: 8px 0 0;
    font-size: 0.9rem;
  }
  .recent-vs-alltime {
    font-size: 0.85rem;
    color: var(--color-muted);
  }
  .zukan-category-header {
    font-weight: bold;
    margin: 12px 0 6px;
  }
  .zukan-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .zukan-item {
    border: 1px solid rgba(46, 125, 50, 0.5);
    border-radius: 8px;
    padding: 6px;
    min-height: 110px;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .zukan-item.locked {
    border-color: rgba(117, 117, 117, 0.4);
    background: rgba(117, 117, 117, 0.12);
    color: var(--color-muted);
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }
  .zukan-item .zukan-svg svg {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .zukan-item .zukan-kc {
    font-size: 0.75rem;
    margin-top: 4px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <h1>Tech Quiz Lab</h1>

  <main id="screen-top">
    <p id="loading-message">問題データを読み込み中...</p>

    <div id="daily-loop-box" hidden>
      <button type="button" class="primary" id="daily-start-btn">今日の20問を始める</button>
      <p id="welcome-back-message" hidden></p>
      <div id="progress-gauge-box">
        <p id="gauge-text"></p>
        <div class="gauge-track"><div class="gauge-fill" id="gauge-fill" style="width:0%"></div></div>
      </div>
      <p id="streak-text"></p>
      <button type="button" id="zukan-link-btn" class="secondary-muted">仕組み図鑑を見る</button>
    </div>

    <section id="stats-box" hidden>
      <h2>累計成績</h2>
      <p id="stats-overall">まだ解答記録がありません。</p>
      <ul id="stats-by-category"></ul>
      <ul id="stats-recent-vs-alltime" class="recent-vs-alltime"></ul>
      <p id="stats-top-wrong-label" class="quiz-meta" hidden>誤答回数の多い問題 上位5件</p>
      <ul id="stats-top-wrong"></ul>
    </section>

    <h2>自由に選んで解く</h2>
    <form id="setup-form" hidden>
      <fieldset>
        <legend>カテゴリ(複数選択可)</legend>
        <div id="category-checkboxes"></div>
      </fieldset>

      <fieldset>
        <legend>レベル(複数選択可)</legend>
        <label><input type="checkbox" name="level" value="1" checked> 初級(用語・図解読み取り)</label>
        <label><input type="checkbox" name="level" value="2" checked> 中級(状況→操作)</label>
        <label><input type="checkbox" name="level" value="3" checked> 上級(トラブル対処)</label>
      </fieldset>

      <fieldset>
        <legend>出題数</legend>
        <select id="count-select">
          <option value="10">10問</option>
          <option value="20">20問</option>
          <option value="all">全部</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>出題モード</legend>
        <label><input type="checkbox" id="review-toggle"> 復習キューから出す(誤答・「勘で当てた」問題)</label>
        <p id="review-queue-count" class="quiz-meta"></p>
      </fieldset>

      <button type="submit" class="primary" id="start-btn">はじめる</button>
      <button type="button" id="reset-btn" class="secondary-muted">進捗をリセット</button>
      <p id="start-error" class="save-warning" hidden></p>
    </form>
  </main>

  <main id="screen-daily-complete" hidden>
    <h2>今日の分は完了!</h2>
    <p id="daily-complete-gauge-text"></p>
    <p id="daily-complete-streak-text"></p>
    <p class="quiz-meta">続けたい場合は、トップの「自由に選んで解く」から追加で出題できます。</p>
    <button type="button" class="secondary-muted back-btn" id="daily-complete-back-btn">トップへ戻る</button>
  </main>

  <main id="screen-zukan" hidden>
    <h2>仕組み図鑑</h2>
    <p class="quiz-meta">正解したことのある問題が公開されます。まだ正解していない問題は灰色の空きマスです。</p>
    <div id="zukan-category-summary"></div>
    <div id="zukan-content"></div>
    <button type="button" id="zukan-back-btn" class="secondary-muted back-btn">トップへ戻る</button>
  </main>

  <main id="screen-zukan-detail" hidden>
    <div class="key-concept-box" id="zukan-detail-key-concept"></div>
    <div class="diagram-box" id="zukan-detail-diagram"></div>
    <div class="explanation-box" id="zukan-detail-explanation"></div>
    <div class="practice-note-box" id="zukan-detail-practice-note"></div>
    <button type="button" id="zukan-detail-back-btn" class="secondary-muted back-btn">図鑑に戻る</button>
  </main>

  <main id="screen-quiz" hidden>
    <p class="quiz-meta" id="quiz-progress"></p>
    <p class="quiz-meta" id="quiz-category"></p>
    <div class="diagram-box" id="quiz-diagram" hidden></div>
    <p class="question-text" id="quiz-question"></p>
    <div id="quiz-choices"></div>
  </main>

  <main id="screen-result" hidden>
    <p class="result-banner" id="result-banner"></p>
    <div class="key-concept-box" id="result-key-concept"></div>
    <div class="diagram-box" id="result-diagram"></div>
    <div class="explanation-box" id="result-explanation"></div>
    <div class="choices-review" id="result-choices"></div>
    <div class="practice-note-box" id="result-practice-note"></div>
    <button type="button" id="guessed-btn">勘で当てた(復習キューに入れる)</button>
    <button type="button" id="next-btn" class="primary">次の問題へ</button>
  </main>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "tq_progress_v1";

  function defaultProgress() {
    return {
      totals: { answered: 0, correct: 0 },
      byCategory: {},
      byLevel: {},
      reviewQueue: [],
      questionStats: {},
      everCorrect: [],
      answerLog: [],
      dailyLoop: {
        startDate: null,
        completedDates: [],
        streakCurrent: 0,
        streakLongest: 0,
        lastCompletedDate: null
      }
    };
  }

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return defaultProgress();
      var base = defaultProgress();
      /* 旧形式(TQ-04以前)のデータにも新フィールドをデフォルト値で補って引き継ぐ */
      return {
        totals: parsed.totals || base.totals,
        byCategory: parsed.byCategory || base.byCategory,
        byLevel: parsed.byLevel || base.byLevel,
        reviewQueue: Array.isArray(parsed.reviewQueue) ? parsed.reviewQueue : base.reviewQueue,
        questionStats: parsed.questionStats || base.questionStats,
        everCorrect: Array.isArray(parsed.everCorrect) ? parsed.everCorrect : base.everCorrect,
        answerLog: Array.isArray(parsed.answerLog) ? parsed.answerLog : base.answerLog,
        dailyLoop: parsed.dailyLoop || base.dailyLoop
      };
    } catch (e) {
      return defaultProgress();
    }
  }

  function todayStr(d) {
    var date = d || new Date();
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var day = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function daysBetween(dateStrA, dateStrB) {
    var a = new Date(dateStrA + "T00:00:00");
    var b = new Date(dateStrB + "T00:00:00");
    return Math.round((b.getTime() - a.getTime()) / 86400000);
  }

  function saveProgress(progress) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      return true;
    } catch (e) {
      return false;
    }
  }

  function clearProgress() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      /* localStorageが使えない環境でも無視して続行する */
    }
  }

  var state = {
    questions: [],
    categories: [],
    progress: loadProgress(),
    pool: [],
    poolIndex: 0,
    current: null,
    shuffledChoices: [],
    answered: false,
    selectedIndex: null,
    guessedPressed: false,
    isDailySession: false,
    zukanCurrentId: null
  };

  function shuffle(array) {
    var a = array.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  var SCREENS = ["screen-top", "screen-quiz", "screen-result", "screen-daily-complete", "screen-zukan", "screen-zukan-detail"];

  function show(id) {
    SCREENS.forEach(function (s) {
      document.getElementById(s).hidden = s !== id;
    });
  }

  function trimDiagram(svgMarkup, keyConcept) {
    /* key_conceptと同内容のキャプション<text>を取り除き(黄色枠との二重表示解消)、
       残った要素のbboxに合わせてviewBoxを詰める。データのSVG文字列自体は変更しない。 */
    var wrapper = document.createElement("div");
    wrapper.style.position = "absolute";
    wrapper.style.visibility = "hidden";
    wrapper.style.pointerEvents = "none";
    wrapper.style.left = "-9999px";
    wrapper.innerHTML = svgMarkup;
    document.body.appendChild(wrapper);
    try {
      var svg = wrapper.querySelector("svg");
      if (!svg) return svgMarkup;
      var texts = svg.querySelectorAll("text");
      texts.forEach(function (t) {
        if (t.textContent.trim() === keyConcept.trim() && t.parentNode) {
          t.parentNode.removeChild(t);
        }
      });
      try {
        var bbox = svg.getBBox();
        var pad = 6;
        svg.setAttribute(
          "viewBox",
          (bbox.x - pad) + " " + (bbox.y - pad) + " " + (bbox.width + pad * 2) + " " + (bbox.height + pad * 2)
        );
      } catch (e) {
        /* getBBoxが使えない環境ではviewBoxをそのまま使う */
      }
      return svg.outerHTML;
    } finally {
      document.body.removeChild(wrapper);
    }
  }

  function renderStats() {
    var box = document.getElementById("stats-box");
    var overall = document.getElementById("stats-overall");
    var byCatEl = document.getElementById("stats-by-category");
    var totals = state.progress.totals;
    box.hidden = false;
    if (totals.answered === 0) {
      overall.textContent = "まだ解答記録がありません。";
    } else {
      var pct = Math.round((totals.correct / totals.answered) * 100);
      overall.textContent = "正答率: " + pct + "%(" + totals.correct + " / " + totals.answered + "問)";
    }
    byCatEl.innerHTML = "";
    Object.keys(state.progress.byCategory).forEach(function (cat) {
      var c = state.progress.byCategory[cat];
      if (!c || c.answered === 0) return;
      var pct = Math.round((c.correct / c.answered) * 100);
      var li = document.createElement("li");
      li.textContent = cat + ": " + pct + "%(" + c.correct + " / " + c.answered + "問)";
      byCatEl.appendChild(li);
    });
    document.getElementById("review-queue-count").textContent =
      "復習キュー: " + state.progress.reviewQueue.length + "問";

    renderTopWrong();
    renderRecentVsAllTime();
  }

  function renderRecentVsAllTime() {
    var listEl = document.getElementById("stats-recent-vs-alltime");
    listEl.innerHTML = "";
    var log = state.progress.answerLog;
    if (log.length === 0) return;

    var today = todayStr();
    var recentByCat = {};
    log.forEach(function (entry) {
      if (daysBetween(entry.d, today) > 6) return; /* 直近7日(当日含む)より前は対象外 */
      if (!recentByCat[entry.cat]) recentByCat[entry.cat] = { answered: 0, correct: 0 };
      recentByCat[entry.cat].answered += 1;
      if (entry.c) recentByCat[entry.cat].correct += 1;
    });

    Object.keys(state.progress.byCategory).forEach(function (cat) {
      var allTime = state.progress.byCategory[cat];
      if (!allTime || allTime.answered === 0) return;
      var recent = recentByCat[cat];
      var allTimePct = Math.round((allTime.correct / allTime.answered) * 100);
      var li = document.createElement("li");
      if (recent && recent.answered > 0) {
        var recentPct = Math.round((recent.correct / recent.answered) * 100);
        li.textContent = cat + " - 直近7日: " + recentPct + "%(" + recent.answered + "問) / 全期間: " + allTimePct + "%(" + allTime.answered + "問)";
      } else {
        li.textContent = cat + " - 直近7日: 解答なし / 全期間: " + allTimePct + "%(" + allTime.answered + "問)";
      }
      listEl.appendChild(li);
    });
  }

  function renderDailyLoopBox() {
    var box = document.getElementById("daily-loop-box");
    box.hidden = false;

    var p = state.progress;
    var totalAnswered = p.totals.answered;
    var goal = 1000;
    var pct = Math.min(100, Math.round((totalAnswered / goal) * 100));
    document.getElementById("gauge-fill").style.width = pct + "%";

    var gaugeText = totalAnswered + " / " + goal + "問(" + pct + "%)";
    if (p.dailyLoop.startDate) {
      var days = daysBetween(p.dailyLoop.startDate, todayStr()) + 1;
      gaugeText += " ・ 開始から" + days + "日目";
    }
    document.getElementById("gauge-text").textContent = gaugeText;

    var streakText = "連続日数: " + p.dailyLoop.streakCurrent + "日(最長 " + p.dailyLoop.streakLongest + "日)";
    document.getElementById("streak-text").textContent = streakText;

    var welcomeEl = document.getElementById("welcome-back-message");
    if (p.dailyLoop.lastCompletedDate) {
      var gap = daysBetween(p.dailyLoop.lastCompletedDate, todayStr());
      if (gap >= 2) {
        welcomeEl.hidden = false;
        welcomeEl.textContent = "おかえり!";
      } else {
        welcomeEl.hidden = true;
      }
    } else {
      welcomeEl.hidden = true;
    }
  }

  function refreshTopScreen() {
    renderStats();
    renderDailyLoopBox();
  }

  function renderZukan() {
    var summaryEl = document.getElementById("zukan-category-summary");
    var contentEl = document.getElementById("zukan-content");
    summaryEl.innerHTML = "";
    contentEl.innerHTML = "";

    var everCorrectSet = {};
    state.progress.everCorrect.forEach(function (id) { everCorrectSet[id] = true; });

    var byCategory = {};
    state.questions.forEach(function (q) {
      if (!byCategory[q.category]) byCategory[q.category] = [];
      byCategory[q.category].push(q);
    });

    Object.keys(byCategory).forEach(function (cat) {
      var list = byCategory[cat];
      var unlockedCount = list.filter(function (q) { return everCorrectSet[q.id]; }).length;

      var summaryP = document.createElement("p");
      summaryP.textContent = cat + ": " + unlockedCount + " / " + list.length + "個";
      summaryEl.appendChild(summaryP);

      var header = document.createElement("div");
      header.className = "zukan-category-header";
      header.textContent = cat;
      contentEl.appendChild(header);

      var grid = document.createElement("div");
      grid.className = "zukan-grid";
      list.forEach(function (q) {
        if (everCorrectSet[q.id]) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "zukan-item";
          var svgWrap = document.createElement("div");
          svgWrap.className = "zukan-svg";
          svgWrap.innerHTML = trimDiagram(q.diagram, q.key_concept);
          var kc = document.createElement("div");
          kc.className = "zukan-kc";
          kc.textContent = q.key_concept;
          btn.appendChild(svgWrap);
          btn.appendChild(kc);
          btn.addEventListener("click", function () { openZukanDetail(q.id); });
          grid.appendChild(btn);
        } else {
          var locked = document.createElement("div");
          locked.className = "zukan-item locked";
          locked.textContent = "?";
          grid.appendChild(locked);
        }
      });
      contentEl.appendChild(grid);
    });
  }

  function openZukanDetail(id) {
    var q = state.questions.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    state.zukanCurrentId = id;
    document.getElementById("zukan-detail-key-concept").textContent = q.key_concept;
    document.getElementById("zukan-detail-diagram").innerHTML = trimDiagram(q.diagram, q.key_concept);
    document.getElementById("zukan-detail-explanation").textContent = q.explanation;
    document.getElementById("zukan-detail-practice-note").textContent = q.practice_note;
    show("screen-zukan-detail");
  }

  function renderTopWrong() {
    var label = document.getElementById("stats-top-wrong-label");
    var listEl = document.getElementById("stats-top-wrong");
    listEl.innerHTML = "";

    var questionById = {};
    state.questions.forEach(function (q) { questionById[q.id] = q; });

    var entries = Object.keys(state.progress.questionStats)
      .map(function (id) {
        var s = state.progress.questionStats[id];
        return { id: id, wrong: s.wrong, attempts: s.attempts };
      })
      .filter(function (e) { return e.wrong > 0; })
      .sort(function (a, b) { return b.wrong - a.wrong; })
      .slice(0, 5);

    if (entries.length === 0) {
      label.hidden = true;
      return;
    }
    label.hidden = false;
    entries.forEach(function (e) {
      var q = questionById[e.id];
      var li = document.createElement("li");
      var kc = q ? q.key_concept : "(問題データ未読み込み)";
      li.textContent = e.id + ": " + kc + "(誤答" + e.wrong + "回 / 出題" + e.attempts + "回)";
      listEl.appendChild(li);
    });
  }

  function renderCategoryCheckboxes() {
    var container = document.getElementById("category-checkboxes");
    container.innerHTML = "";
    state.categories.forEach(function (cat, idx) {
      var label = document.createElement("label");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.name = "category";
      input.value = cat;
      input.checked = true;
      input.id = "cat-" + idx;
      label.appendChild(input);
      label.appendChild(document.createTextNode(cat));
      container.appendChild(label);
    });
  }

  function getSelectedCategories() {
    var boxes = document.querySelectorAll('input[name="category"]:checked');
    var result = [];
    boxes.forEach(function (b) { result.push(b.value); });
    return result;
  }

  function getSelectedLevels() {
    var boxes = document.querySelectorAll('input[name="level"]:checked');
    var result = [];
    boxes.forEach(function (b) { result.push(parseInt(b.value, 10)); });
    return result;
  }

  function buildPool() {
    var selectedCats = getSelectedCategories();
    var selectedLevels = getSelectedLevels();
    var reviewMode = document.getElementById("review-toggle").checked;
    var countValue = document.getElementById("count-select").value;

    var candidates = state.questions.filter(function (q) {
      return selectedCats.indexOf(q.category) !== -1 && selectedLevels.indexOf(q.difficulty) !== -1;
    });

    if (reviewMode) {
      var queueSet = {};
      state.progress.reviewQueue.forEach(function (id) { queueSet[id] = true; });
      candidates = candidates.filter(function (q) { return queueSet[q.id]; });
    }

    candidates = shuffle(candidates);

    if (countValue !== "all") {
      var n = parseInt(countValue, 10);
      candidates = candidates.slice(0, n);
    }

    return candidates;
  }

  var DAILY_REVIEW_MAX = 5;
  var DAILY_TOTAL = 20;
  var DAILY_CATEGORY_CAP = 10;

  function categoryAccuracy(progress, cat) {
    var c = progress.byCategory[cat];
    if (!c || c.answered === 0) return -1; /* 未経験のカテゴリを優先するための番兵値 */
    return c.correct / c.answered;
  }

  function pickInto(target, categoryCount, candidates, remaining, cap, usedIds) {
    for (var i = 0; i < candidates.length && remaining > 0; i++) {
      var q = candidates[i];
      if (usedIds[q.id]) continue;
      var cnt = categoryCount[q.category] || 0;
      if (cnt >= cap) continue;
      target.push(q);
      usedIds[q.id] = true;
      categoryCount[q.category] = cnt + 1;
      remaining--;
    }
    return remaining;
  }

  function pickIntoNoCap(target, candidates, remaining, usedIds) {
    for (var i = 0; i < candidates.length && remaining > 0; i++) {
      var q = candidates[i];
      if (usedIds[q.id]) continue;
      target.push(q);
      usedIds[q.id] = true;
      remaining--;
    }
    return remaining;
  }

  function buildDailyPool(questions, progress) {
    var usedIds = {};

    /* 1. 復習キューから最大5問(古い順=reviewQueue配列の追加順をそのまま使う) */
    var byId = {};
    questions.forEach(function (q) { byId[q.id] = q; });
    var reviewPicks = [];
    progress.reviewQueue.forEach(function (id) {
      if (reviewPicks.length >= DAILY_REVIEW_MAX) return;
      var q = byId[id];
      if (q && !usedIds[id]) {
        reviewPicks.push(q);
        usedIds[id] = true;
      }
    });

    /* 1b. 復習が5問に満たない分は新規枠に回し、合計が常に20問になるようにする
       (問題バンク全体が20問未満の場合を除く) */
    var newTarget = DAILY_TOTAL - reviewPicks.length;

    /* 2. レベル方針: 初級の正答率が80%未満(またはデータ無し)なら新規枠の最低7割を
       初級から取り、80%以上なら中級を半分以上にする。カテゴリ上限より先に適用する
       (「3b」でカテゴリ上限を無視して確保し、上限は「4」以降の残り枠から適用する) */
    var lvl1 = progress.byLevel[1];
    var lvl1Acc = (lvl1 && lvl1.answered > 0) ? (lvl1.correct / lvl1.answered) : null;
    var preferLevel1 = lvl1Acc === null || lvl1Acc < 0.8;
    var preferredLevel = preferLevel1 ? 1 : 2;
    var levelQuota = preferLevel1 ? Math.ceil(newTarget * 0.7) : Math.ceil(newTarget / 2);

    /* 3. 未出題の候補を、カテゴリの正答率が低い順(未経験カテゴリ優先)に並べる。
       同率の場合は優先レベルを先に出す */
    var unanswered = questions.filter(function (q) {
      return !usedIds[q.id] && !progress.questionStats[q.id];
    });
    unanswered.sort(function (a, b) {
      var accDiff = categoryAccuracy(progress, a.category) - categoryAccuracy(progress, b.category);
      if (accDiff !== 0) return accDiff;
      var rankA = a.difficulty === preferredLevel ? 0 : 1;
      var rankB = b.difficulty === preferredLevel ? 0 : 1;
      if (rankA !== rankB) return rankA - rankB;
      return 0;
    });

    var newPicks = [];
    var categoryCount = {};
    var remaining = newTarget;

    /* 3b. 優先レベル分を、カテゴリ上限を無視して先に確保する(レベル優先を
       カテゴリ上限より先に適用するため) */
    var preferredCandidates = unanswered.filter(function (q) { return q.difficulty === preferredLevel; });
    var levelQuotaTarget = Math.min(levelQuota, remaining);
    var levelQuotaLeftover = pickIntoNoCap(newPicks, preferredCandidates, levelQuotaTarget, usedIds);
    remaining = remaining - (levelQuotaTarget - levelQuotaLeftover);

    /* 4. 残り枠は、優先度順(未出題・カテゴリ正答率順)にカテゴリ上限10を適用して埋める */
    if (remaining > 0) {
      remaining = pickInto(newPicks, categoryCount, unanswered, remaining, DAILY_CATEGORY_CAP, usedIds);
    }

    /* 5. 未出題が尽きたら、既出題の中から誤答回数の多い順に再出題する */
    if (remaining > 0) {
      var answeredPool = questions.filter(function (q) {
        return !usedIds[q.id] && progress.questionStats[q.id];
      });
      answeredPool.sort(function (a, b) {
        return progress.questionStats[b.id].wrong - progress.questionStats[a.id].wrong;
      });
      remaining = pickInto(newPicks, categoryCount, answeredPool, remaining, DAILY_CATEGORY_CAP, usedIds);
    }

    /* 6. カテゴリ数が少なく上限に達して埋まりきらない場合は、上限を外して残りを埋める
       (問題バンクが少数カテゴリに偏っている間の救済措置。カテゴリが増えれば発生しにくくなる。
       ソート済みのunansweredを再利用し、優先レベル順を維持したまま埋める) */
    if (remaining > 0) {
      var leftoverUnanswered = unanswered.filter(function (q) { return !usedIds[q.id]; });
      remaining = pickIntoNoCap(newPicks, leftoverUnanswered, remaining, usedIds);
    }
    if (remaining > 0) {
      var leftoverAnswered = questions.filter(function (q) {
        return !usedIds[q.id] && progress.questionStats[q.id];
      }).sort(function (a, b) {
        return progress.questionStats[b.id].wrong - progress.questionStats[a.id].wrong;
      });
      remaining = pickIntoNoCap(newPicks, leftoverAnswered, remaining, usedIds);
    }

    return shuffle(reviewPicks.concat(newPicks));
  }

  function startQuiz(pool) {
    state.pool = pool;
    state.poolIndex = 0;
    showQuestion();
  }

  function showQuestion() {
    state.current = state.pool[state.poolIndex];
    state.answered = false;
    state.selectedIndex = null;
    state.guessedPressed = false;

    var choicesWithIndex = state.current.choices.map(function (c, i) {
      return { choice: c, originalIndex: i };
    });
    state.shuffledChoices = shuffle(choicesWithIndex);

    document.getElementById("quiz-progress").textContent =
      (state.poolIndex + 1) + " / " + state.pool.length + "問";
    document.getElementById("quiz-category").textContent =
      state.current.category + " ・ " + state.current.subtopic;

    var quizDiagram = document.getElementById("quiz-diagram");
    if (state.current.question_type === "diagram_read") {
      quizDiagram.innerHTML = trimDiagram(state.current.diagram, state.current.key_concept);
      quizDiagram.hidden = false;
    } else {
      quizDiagram.innerHTML = "";
      quizDiagram.hidden = true;
    }

    document.getElementById("quiz-question").textContent = state.current.question;

    var labels = ["A", "B", "C", "D"];
    var container = document.getElementById("quiz-choices");
    container.innerHTML = "";
    state.shuffledChoices.forEach(function (entry, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice-btn";
      var labelSpan = document.createElement("span");
      labelSpan.className = "choice-label";
      labelSpan.textContent = labels[i] + ".";
      var textSpan = document.createElement("span");
      textSpan.textContent = entry.choice.text;
      btn.appendChild(labelSpan);
      btn.appendChild(textSpan);
      btn.addEventListener("click", function () { onAnswer(entry.originalIndex); });
      container.appendChild(btn);
    });

    show("screen-quiz");
  }

  function onAnswer(originalIndex) {
    if (state.answered) return;
    state.answered = true;
    state.selectedIndex = originalIndex;

    var q = state.current;
    var isCorrect = originalIndex === q.answer_index;

    updateProgressOnAnswer(q, isCorrect);
    renderResult(q, isCorrect, originalIndex);
    show("screen-result");
  }

  function updateProgressOnAnswer(q, isCorrect) {
    var p = state.progress;
    p.totals.answered += 1;
    if (isCorrect) p.totals.correct += 1;

    if (!p.byCategory[q.category]) {
      p.byCategory[q.category] = { answered: 0, correct: 0 };
    }
    p.byCategory[q.category].answered += 1;
    if (isCorrect) p.byCategory[q.category].correct += 1;

    if (!p.questionStats[q.id]) {
      p.questionStats[q.id] = { attempts: 0, wrong: 0 };
    }
    p.questionStats[q.id].attempts += 1;
    if (!isCorrect) p.questionStats[q.id].wrong += 1;

    if (!p.byLevel[q.difficulty]) {
      p.byLevel[q.difficulty] = { answered: 0, correct: 0 };
    }
    p.byLevel[q.difficulty].answered += 1;
    if (isCorrect) p.byLevel[q.difficulty].correct += 1;

    if (isCorrect && p.everCorrect.indexOf(q.id) === -1) {
      p.everCorrect.push(q.id);
    }

    p.answerLog.push({ d: todayStr(), cat: q.category, c: isCorrect });

    if (isCorrect) {
      /* 正解確定時点で即座にキューから外す。この後「勘で当てた」が押されれば
         guessed-btnのハンドラで即座にキューへ戻す(上書き)。 */
      removeFromReviewQueue(q.id);
    } else {
      addToReviewQueue(q.id);
    }

    var saved = saveProgress(p);
    showSaveWarningIfNeeded(saved);
  }

  function completeDailyLoopIfNeeded() {
    if (!state.isDailySession) return;
    var p = state.progress;
    var today = todayStr();
    if (!p.dailyLoop.startDate) {
      p.dailyLoop.startDate = today;
    }
    if (p.dailyLoop.completedDates.indexOf(today) === -1) {
      p.dailyLoop.completedDates.push(today);
      if (p.dailyLoop.lastCompletedDate && daysBetween(p.dailyLoop.lastCompletedDate, today) === 1) {
        p.dailyLoop.streakCurrent += 1;
      } else {
        p.dailyLoop.streakCurrent = 1;
      }
      p.dailyLoop.streakLongest = Math.max(p.dailyLoop.streakLongest, p.dailyLoop.streakCurrent);
      p.dailyLoop.lastCompletedDate = today;
      saveProgress(p);
    }
  }

  function addToReviewQueue(id) {
    if (state.progress.reviewQueue.indexOf(id) === -1) {
      state.progress.reviewQueue.push(id);
    }
  }

  function removeFromReviewQueue(id) {
    var idx = state.progress.reviewQueue.indexOf(id);
    if (idx !== -1) {
      state.progress.reviewQueue.splice(idx, 1);
    }
  }

  function showSaveWarningIfNeeded(saved) {
    var el = document.getElementById("start-error");
    if (!saved) {
      el.hidden = false;
      el.textContent = "進捗の保存に失敗しました(このブラウザではlocalStorageが使えない可能性があります)。このセッション中は引き続き利用できます。";
    }
  }

  function renderResult(q, isCorrect, selectedOriginalIndex) {
    var banner = document.getElementById("result-banner");
    banner.textContent = isCorrect ? "正解" : "不正解";
    banner.className = "result-banner " + (isCorrect ? "correct" : "wrong");

    document.getElementById("result-key-concept").textContent = q.key_concept;
    document.getElementById("result-diagram").innerHTML = trimDiagram(q.diagram, q.key_concept);
    document.getElementById("result-explanation").textContent = q.explanation;
    document.getElementById("result-practice-note").textContent = q.practice_note;

    var reviewContainer = document.getElementById("result-choices");
    reviewContainer.innerHTML = "";
    var labels = ["A", "B", "C", "D"];
    state.shuffledChoices.forEach(function (entry, i) {
      var item = document.createElement("div");
      item.className = "choice-review-item";
      var isAnswer = entry.originalIndex === q.answer_index;
      var isUserPick = entry.originalIndex === selectedOriginalIndex;
      if (isAnswer) item.classList.add("is-correct-answer");
      if (isUserPick && !isAnswer) item.classList.add("is-user-wrong-pick");

      var textEl = document.createElement("div");
      textEl.className = "choice-review-text";
      textEl.textContent = labels[i] + ". " + entry.choice.text + (isUserPick ? "(選択)" : "");
      item.appendChild(textEl);

      var whyEl = document.createElement("div");
      whyEl.className = "choice-review-why";
      whyEl.textContent = isAnswer ? entry.choice.why_right : entry.choice.why_wrong;
      item.appendChild(whyEl);

      reviewContainer.appendChild(item);
    });

    var guessedBtn = document.getElementById("guessed-btn");
    guessedBtn.disabled = false;
    guessedBtn.textContent = "勘で当てた(復習キューに入れる)";
  }

  document.getElementById("guessed-btn").addEventListener("click", function () {
    state.guessedPressed = true;
    addToReviewQueue(state.current.id);
    saveProgress(state.progress);
    var guessedBtn = document.getElementById("guessed-btn");
    guessedBtn.disabled = true;
    guessedBtn.textContent = "復習キューに入れました";
  });

  document.getElementById("next-btn").addEventListener("click", function () {
    /* 復習キューの増減は解答確定時・guessed-btn押下時に即保存済みのため、
       ここでは次の問題へ進むだけでよい */
    state.poolIndex += 1;
    if (state.poolIndex >= state.pool.length) {
      if (state.isDailySession) {
        completeDailyLoopIfNeeded();
        var p = state.progress;
        var goal = 1000;
        var pct = Math.min(100, Math.round((p.totals.answered / goal) * 100));
        document.getElementById("daily-complete-gauge-text").textContent =
          p.totals.answered + " / " + goal + "問(" + pct + "%)";
        document.getElementById("daily-complete-streak-text").textContent =
          "連続日数: " + p.dailyLoop.streakCurrent + "日(最長 " + p.dailyLoop.streakLongest + "日)";
        state.isDailySession = false;
        show("screen-daily-complete");
      } else {
        refreshTopScreen();
        show("screen-top");
      }
    } else {
      showQuestion();
    }
  });

  document.getElementById("daily-start-btn").addEventListener("click", function () {
    var errorEl = document.getElementById("start-error");
    errorEl.hidden = true;
    var pool = buildDailyPool(state.questions, state.progress);
    if (pool.length === 0) {
      errorEl.hidden = false;
      errorEl.textContent = "出題できる問題がありません。";
      return;
    }
    state.isDailySession = true;
    startQuiz(pool);
  });

  function bindBackButton(id, action) {
    document.getElementById(id).addEventListener("click", action);
  }

  bindBackButton("daily-complete-back-btn", function () {
    refreshTopScreen();
    show("screen-top");
  });

  document.getElementById("zukan-link-btn").addEventListener("click", function () {
    renderZukan();
    show("screen-zukan");
  });

  bindBackButton("zukan-back-btn", function () {
    refreshTopScreen();
    show("screen-top");
  });

  bindBackButton("zukan-detail-back-btn", function () {
    renderZukan();
    show("screen-zukan");
  });

  document.getElementById("setup-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var errorEl = document.getElementById("start-error");
    errorEl.hidden = true;

    var pool = buildPool();
    if (pool.length === 0) {
      errorEl.hidden = false;
      errorEl.textContent = "条件に合う問題がありません(カテゴリ・復習キューの設定を見直してください)。";
      return;
    }
    state.isDailySession = false;
    startQuiz(pool);
  });

  document.getElementById("reset-btn").addEventListener("click", function () {
    if (!window.confirm("進捗(成績・復習キュー)をすべてリセットします。よろしいですか?")) {
      return;
    }
    clearProgress();
    state.progress = defaultProgress();
    refreshTopScreen();
  });

  function init() {
    fetch("data/questions/index.json")
      .then(function (res) { return res.json(); })
      .then(function (manifest) {
        state.categories = manifest.map(function (m) { return m.category; });
        return Promise.all(
          manifest.map(function (m) {
            return fetch("data/questions/" + m.file).then(function (res) { return res.json(); });
          })
        );
      })
      .then(function (fileResults) {
        state.questions = [].concat.apply([], fileResults);
        document.getElementById("loading-message").hidden = true;
        renderCategoryCheckboxes();
        refreshTopScreen();
        document.getElementById("setup-form").hidden = false;
      })
      .catch(function (err) {
        document.getElementById("loading-message").textContent =
          "問題データの読み込みに失敗しました(" + err.message + ")。ネットワーク接続、またはローカルサーバー経由で開いているかを確認してください。";
      });
  }

  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      /* 登録に失敗しても画面は通常どおり動作させる(オフライン対応が効かないだけ) */
      console.warn("service worker registration failed", err);
    });
  }

  init();
  registerServiceWorker();

  /* 編成ルールの自動テスト用フック。UI・保存動作には影響しない。 */
  window.__tqTest = {
    buildDailyPool: buildDailyPool,
    defaultProgress: defaultProgress,
    getState: function () { return state; },
    todayStr: todayStr,
    daysBetween: daysBetween
  };
})();
</script>
</body>
</html>
